[project]
name = "graphrag-pipeline"
version = "0.1.0"
description = "Self-Correcting GraphRAG Knowledge Pipeline with Autonomous Entity Resolution (RIT MS Capstone)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-community==0.4.1",
    "neo4j>=5.24,<6",
    "neo4j-graphrag[ollama,openai]>=1.21,<2",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "ragas==0.4.3",
    "tiktoken>=0.8,<1",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[project.scripts]
graphrag-query = "graphrag_pipeline.query_command:main"
graphrag-eval = "graphrag_pipeline.evaluation.command:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:neo4j",
]
