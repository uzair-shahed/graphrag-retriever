<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 287" role="img"><title>Entity micro F1: sensitivity to representation</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#183047" font-size="15"><text x="20" y="30" font-size="21" font-weight="bold">Entity micro F1: sensitivity to representation</text><text x="20" y="60">Official: exact normalized surface + type</text><rect x="20" y="70" width="880" height="20" rx="3" fill="#edf2f7"/><rect x="20" y="70" width="327.710" height="20" rx="3" fill="#2463a6"/><text x="920" y="85">37.24%</text><text x="20" y="124">Diagnostic: harmonize CamelCase type formatting</text><rect x="20" y="134" width="880" height="20" rx="3" fill="#edf2f7"/><rect x="20" y="134" width="335.301" height="20" rx="3" fill="#5b7fa6"/><text x="920" y="149">38.10%</text><text x="20" y="188">Diagnostic: exact normalized surface only (ignore type)</text><rect x="20" y="198" width="880" height="20" rx="3" fill="#edf2f7"/><rect x="20" y="198" width="519.480" height="20" rx="3" fill="#007d75"/><text x="920" y="213">59.03%</text><text x="20" y="277">Same predictions; different matching questions. Higher diagnostic scores are not model improvements.</text></g></svg>